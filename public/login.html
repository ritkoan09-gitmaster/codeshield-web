<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShield Enterprise | Secure Authentication</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* DataCore Background Spotlight Grid */
        .bg-datacore-grid {
            background-color: #030712;
            background-image: 
                radial-gradient(ellipse 90% 60% at 50% -10%, rgba(37, 99, 235, 0.35), transparent 70%),
                radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* Glassmorphism Container */
        .glass-container {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.8) 0%, rgba(7, 13, 27, 0.9) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.9),
                0 0 35px 0 rgba(37, 99, 235, 0.15),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Glowing Blue Button */
        .datacore-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .datacore-btn:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-datacore-grid text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased relative overflow-x-hidden selection:bg-blue-500 selection:text-white p-4 sm:p-6">
    
    <div class="max-w-md w-full glass-container rounded-2xl p-6 sm:p-8 relative z-10 mx-auto">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center bg-gradient-to-br from-blue-500 via-indigo-600 to-blue-700 p-3 rounded-2xl text-white font-extrabold text-2xl mb-3 shadow-lg shadow-blue-500/30 border border-white/20">🛡️</div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                CodeShield Enterprise
                <span class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider shadow-sm">Secure Access</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1 font-normal">Multi-Vector Security Auditing & AI Workspace</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-950/60 p-1 rounded-xl border border-white/10 mb-6 text-xs font-medium shadow-inner">
            <button onclick="switchTab('login')" id="loginTab" class="w-1/2 py-2.5 rounded-lg datacore-btn text-white font-semibold transition shadow-sm">Sign In</button>
            <button onclick="switchTab('signup')" id="signupTab" class="w-1/2 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition font-medium">Create Account</button>
        </div>

        <!-- Form -->
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden transition-all duration-300">
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Full Name</label>
                <input type="text" id="name" placeholder="Rituraj Kotian" class="w-full bg-slate-950/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500/60 transition shadow-inner font-normal">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Email Address</label>
                <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-slate-950/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500/60 transition shadow-inner font-normal">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500/60 transition shadow-inner font-normal">
            </div>
            <button type="submit" id="submitBtn" class="w-full datacore-btn text-white font-bold py-3.5 rounded-xl transition duration-200 text-xs mt-2 flex items-center justify-center space-x-2">
                <span id="btnText">Sign In to Dashboard</span>
            </button>
        </form>

        <p id="errorMsg" class="text-xs text-rose-400 text-center mt-4 hidden bg-rose-500/10 border border-rose-500/20 py-2.5 rounded-lg font-normal"></p>
        
        <div class="mt-8 pt-4 border-t border-white/10 text-center">
            <p class="text-[11px] text-slate-500 font-normal">Secured with Enterprise Session Tokenization & AI Integration</p>
        </div>
    </div>

    <script>
        let isLogin = true;

        function switchTab(tab) {
            isLogin = (tab === 'login');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const nameField = document.getElementById('nameField');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            if (isLogin) {
                loginTab.className = "w-1/2 py-2.5 rounded-lg datacore-btn text-white font-semibold transition shadow-sm text-xs";
                signupTab.className = "w-1/2 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition text-xs font-medium";
                nameField.classList.add('hidden');
                btnText.textContent = "Sign In to Dashboard";
            } else {
                signupTab.className = "w-1/2 py-2.5 rounded-lg datacore-btn text-white font-semibold transition shadow-sm text-xs";
                loginTab.className = "w-1/2 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition text-xs font-medium";
                nameField.classList.remove('hidden');
                btnText.textContent = "Register & Access Platform";
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const errorMsg = document.getElementById('errorMsg');

            const endpoint = isLogin ? '/api/login' : '/api/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('codeshield_user', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "Failed to connect to authentication server.";
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
