<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShield Enterprise | Secure Gateway</title>
    <!-- Modern Stylish Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --c1-midnight: #0A1931;
            --c2-mist: #B3CFE5;
            --c3-ocean: #4A7FA7;
            --c4-slate: #1A3D63;
            --c5-white: #F6FAFD;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #F6FAFD;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Live Moving Gradient Background (1st #0A1931 and 3rd #4A7FA7) */
        .live-moving-bg {
            background: linear-gradient(-45deg, #0A1931, #132E52, #4A7FA7, #0B1E38, #0A1931);
            background-size: 400% 400%;
            animation: liveGradientShift 16s ease infinite;
            position: relative;
        }

        @keyframes liveGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Box: 2nd Last Color (#1A3D63), Border 1st & Last (#0A1931 / #F6FAFD), Hover White */
        .feature-box {
            background: rgba(26, 61, 99, 0.88);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1.5px solid rgba(246, 250, 253, 0.22);
            box-shadow: 
                0 25px 60px -15px rgba(10, 25, 49, 0.85),
                inset 0 1px 1px 0 rgba(246, 250, 253, 0.3);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .feature-box:hover {
            border-color: #F6FAFD !important;
            box-shadow: 
                0 30px 70px -15px rgba(0, 0, 0, 0.9),
                0 0 35px 0 rgba(246, 250, 253, 0.35),
                inset 0 1px 2px 0 #FFFFFF;
            transform: translateY(-2px);
        }

        /* Input Controls */
        .glass-input {
            background: rgba(10, 25, 49, 0.65);
            border: 1.5px solid rgba(246, 250, 253, 0.18);
            color: #F6FAFD;
            transition: all 0.25s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #F6FAFD;
            background: rgba(10, 25, 49, 0.9);
            box-shadow: 0 0 0 3px rgba(179, 207, 229, 0.25), 0 0 20px rgba(246, 250, 253, 0.25);
        }

        .glass-input::placeholder {
            color: rgba(179, 207, 229, 0.45);
        }

        /* Action Button */
        .btn-brand {
            background: linear-gradient(135deg, #F6FAFD 0%, #B3CFE5 100%);
            color: #0A1931;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px -4px rgba(179, 207, 229, 0.4), inset 0 1px 0 #FFFFFF;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-brand:hover {
            background: #FFFFFF;
            color: #0A1931;
            box-shadow: 0 12px 30px -4px rgba(246, 250, 253, 0.6), 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-1.5px);
        }

        .btn-brand:active {
            transform: translateY(0.5px);
        }

        /* Tab Switcher */
        .tab-active {
            background: #F6FAFD;
            color: #0A1931;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(10, 25, 49, 0.3);
        }

        .tab-inactive {
            color: #B3CFE5;
        }

        .tab-inactive:hover {
            color: #F6FAFD;
        }
    </style>
</head>
<body class="live-moving-bg min-h-screen flex items-center justify-center p-4 sm:p-6 relative selection:bg-[#B3CFE5] selection:text-[#0A1931]">

    <!-- Floating Ambient Mesh Droplets -->
    <div class="fixed top-1/4 left-1/4 w-[420px] h-[420px] rounded-full bg-[#4A7FA7]/25 blur-[90px] pointer-events-none -z-10 animate-pulse"></div>
    <div class="fixed bottom-1/4 right-1/4 w-[380px] h-[380px] rounded-full bg-[#0A1931]/60 blur-[100px] pointer-events-none -z-10"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Auth Box (2nd Last Color: #1A3D63, Border: #F6FAFD/#0A1931, Hover: White) -->
        <div class="feature-box p-6 sm:p-8">
            
            <!-- Brand Header -->
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#0A1931] border border-[#F6FAFD]/30 shadow-[0_0_25px_rgba(179,207,229,0.3)] mb-3.5">
                    <svg class="w-7 h-7 text-[#F6FAFD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-[#F6FAFD] mb-1">
                    CodeShield <span class="text-[#B3CFE5] font-semibold">Enterprise</span>
                </h1>
                <p class="text-xs text-[#B3CFE5]/80 font-normal">
                    Multi-Vector SAST Engine & AI Security Workspace
                </p>
                <div class="inline-flex items-center gap-2 mt-2.5 px-3 py-1 rounded-full bg-[#0A1931]/70 border border-[#F6FAFD]/20 text-[11px] text-[#B3CFE5] font-mono">
                    <span class="w-2 h-2 rounded-full bg-[#34D399] animate-pulse"></span>
                    <span>SECURE ACCESS PORTAL</span>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 p-1 bg-[#0A1931]/80 rounded-xl border border-[#F6FAFD]/15 mb-6 text-xs font-semibold">
                <button onclick="switchTab('login')" id="loginTab" class="py-2.5 rounded-lg tab-active transition-all duration-200">
                    Sign In
                </button>
                <button onclick="switchTab('signup')" id="signupTab" class="py-2.5 rounded-lg tab-inactive transition-all duration-200">
                    Register
                </button>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                
                <!-- Name field (Signup only) -->
                <div id="nameField" class="hidden space-y-1.5 transition-all duration-300">
                    <label class="block text-xs font-medium text-[#B3CFE5]">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-[#B3CFE5]/50">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="name" placeholder="Rituraj Kotian"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-[#B3CFE5]/30">
                    </div>
                </div>

                <!-- Email field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-[#B3CFE5]">Work Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-[#B3CFE5]/50">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input type="email" id="email" required placeholder="developer@company.com"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-[#B3CFE5]/30">
                    </div>
                </div>

                <!-- Password field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-[#B3CFE5]">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-[#B3CFE5]/50">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••••••"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-[#B3CFE5]/30">
                    </div>
                </div>

                <!-- Error Notice -->
                <div id="errorMsg" class="hidden text-xs text-rose-300 bg-rose-500/15 border border-rose-500/30 px-3.5 py-2.5 rounded-xl flex items-center gap-2">
                    <svg class="w-4 h-4 shrink-0 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Invalid authentication credentials.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn-brand w-full py-3.5 rounded-xl font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-2 mt-2">
                    <span id="btnText">Sign In to Dashboard</span>
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <!-- Quick Demo Credentials for interview presentation -->
            <div class="mt-5 pt-4 border-t border-[#F6FAFD]/15">
                <button type="button" onclick="fillDemoCredentials()" 
                    class="w-full text-center py-2.5 px-3 rounded-xl bg-[#0A1931]/60 hover:bg-[#0A1931] border border-[#F6FAFD]/20 text-[#F6FAFD] text-xs font-medium flex items-center justify-center gap-2 transition-all">
                    <svg class="w-4 h-4 text-[#B3CFE5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m13 2-2 2.5h3L11 8l3-1-3.5 5 1.5-3H9l2.5-4.5H9L13 2z"/>
                    </svg>
                    <span>Auto-Fill Demo Account (Raj Shamani)</span>
                </button>
            </div>

            <!-- Footer Badge -->
            <div class="mt-6 pt-4 border-t border-[#F6FAFD]/15 flex items-center justify-between text-[11px] text-[#B3CFE5]/60">
                <span class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-[#B3CFE5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    AES-256 Session Token
                </span>
                <span>Tenant Isolated</span>
            </div>

        </div>

        <p class="text-center text-xs text-[#B3CFE5]/60 mt-4">
            CodeShield Enterprise • Static Application Security Platform
        </p>
    </div>

    <script>
        let isLogin = true;

        function switchTab(tab) {
            isLogin = (tab === 'login');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const nameField = document.getElementById('nameField');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            if (isLogin) {
                loginTab.className = "py-2.5 rounded-lg tab-active transition-all duration-200";
                signupTab.className = "py-2.5 rounded-lg tab-inactive transition-all duration-200";
                nameField.classList.add('hidden');
                document.getElementById('name').removeAttribute('required');
                btnText.textContent = "Sign In to Dashboard";
            } else {
                signupTab.className = "py-2.5 rounded-lg tab-active transition-all duration-200";
                loginTab.className = "py-2.5 rounded-lg tab-inactive transition-all duration-200";
                nameField.classList.remove('hidden');
                document.getElementById('name').setAttribute('required', 'true');
                btnText.textContent = "Register & Access Platform";
            }
        }

        function fillDemoCredentials() {
            if (!isLogin) switchTab('login');
            document.getElementById('email').value = "raj@gmail.com";
            document.getElementById('password').value = "raj";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            const endpoint = isLogin ? '/api/login' : '/api/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('codeshield_user', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    errorText.textContent = data.error || "Authentication failed.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = "Failed to connect to authentication server.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
