<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShield Enterprise | Secure Access Portal</title>
    <!-- Modern Enterprise Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        evergreen: {
                            base: '#012618',
                            dark: '#013220',
                            pine: '#0B6E4F',
                            emerald: '#50C878',
                            mint: '#D1F2EB',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --dark-evergreen: #013220;
            --royal-pine: #0B6E4F;
            --emerald-green: #50C878;
            --mint-whisper: #D1F2EB;
        }

        body {
            background-color: #012618;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #D1F2EB;
            overflow-x: hidden;
        }

        /* Ambient Glassmorphic Background */
        .ambient-bg {
            background-color: #012618;
            background-image: 
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(11, 110, 79, 0.45), transparent 70%),
                radial-gradient(circle at 10% 85%, rgba(80, 200, 120, 0.12), transparent 45%),
                radial-gradient(circle at 90% 75%, rgba(11, 110, 79, 0.2), transparent 50%);
        }

        /* Frosted Glassmorphism Card */
        .glass-panel {
            background: linear-gradient(145deg, rgba(11, 110, 79, 0.22) 0%, rgba(1, 50, 32, 0.65) 100%);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(209, 242, 235, 0.16);
            box-shadow: 
                0 30px 60px -15px rgba(0, 18, 10, 0.75),
                0 0 35px -5px rgba(80, 200, 120, 0.12),
                inset 0 1px 1px 0 rgba(209, 242, 235, 0.25);
            border-radius: 1.5rem;
        }

        /* Glassmorphism Inner Pill / Input */
        .glass-input {
            background: rgba(1, 38, 24, 0.65);
            border: 1px solid rgba(209, 242, 235, 0.14);
            color: #D1F2EB;
            transition: all 0.25s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #50C878;
            background: rgba(1, 38, 24, 0.9);
            box-shadow: 0 0 0 3px rgba(80, 200, 120, 0.22), 0 0 20px -3px rgba(80, 200, 120, 0.25);
        }
        .glass-input::placeholder {
            color: rgba(209, 242, 235, 0.35);
        }

        /* Modern Gradient CTA Button */
        .btn-emerald {
            background: linear-gradient(135deg, #0B6E4F 0%, #50C878 100%);
            color: #012618;
            font-weight: 700;
            border: 1px solid rgba(209, 242, 235, 0.35);
            box-shadow: 0 8px 24px -4px rgba(80, 200, 120, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-emerald:hover {
            background: linear-gradient(135deg, #0F835F 0%, #5CE087 100%);
            box-shadow: 0 12px 30px -4px rgba(80, 200, 120, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-1.5px);
        }
        .btn-emerald:active {
            transform: translateY(0.5px);
        }

        /* Smooth Tab Switcher */
        .tab-active {
            background: rgba(11, 110, 79, 0.6);
            color: #D1F2EB;
            border: 1px solid rgba(209, 242, 235, 0.25);
            box-shadow: 0 4px 12px rgba(0, 18, 10, 0.3), inset 0 1px 0 rgba(209, 242, 235, 0.2);
        }
        .tab-inactive {
            color: rgba(209, 242, 235, 0.55);
        }
        .tab-inactive:hover {
            color: #D1F2EB;
        }

        /* Organic Pulse Status Dot */
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #50C878;
            border-radius: 9999px;
            box-shadow: 0 0 10px #50C878;
        }
    </style>
</head>
<body class="ambient-bg min-h-screen flex items-center justify-center p-4 sm:p-6 relative selection:bg-evergreen-emerald selection:text-evergreen-dark">

    <!-- Ambient Glow Drops -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 rounded-full bg-evergreen-pine/20 blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 rounded-full bg-evergreen-emerald/10 blur-3xl pointer-events-none -z-10"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md relative z-10">
        
        <div class="glass-panel p-6 sm:p-8">
            
            <!-- Logo & Brand Header -->
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-evergreen-pine/80 to-evergreen-dark border border-evergreen-mint/30 shadow-[0_0_25px_rgba(80,200,120,0.25)] mb-3.5">
                    <svg class="w-7 h-7 text-evergreen-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white mb-1">
                    CodeShield <span class="text-evergreen-emerald font-semibold">Enterprise</span>
                </h1>
                <p class="text-xs text-evergreen-mint/70 font-normal">
                    Intelligent Static Application Security Platform
                </p>
                <div class="inline-flex items-center gap-2 mt-2.5 px-2.5 py-1 rounded-full bg-evergreen-dark/60 border border-evergreen-mint/15 text-[11px] text-evergreen-mint/80 font-mono">
                    <span class="status-dot"></span>
                    <span>GATEWAY SECURE</span>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 p-1 bg-evergreen-base/70 rounded-xl border border-evergreen-mint/10 mb-6 text-xs font-medium">
                <button onclick="switchTab('login')" id="loginTab" class="py-2.5 rounded-lg tab-active transition-all duration-200 font-semibold">
                    Sign In
                </button>
                <button onclick="switchTab('signup')" id="signupTab" class="py-2.5 rounded-lg tab-inactive transition-all duration-200">
                    Create Account
                </button>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                
                <!-- Name field (Signup only) -->
                <div id="nameField" class="hidden space-y-1.5 transition-all duration-300">
                    <label class="block text-xs font-medium text-evergreen-mint/80">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-evergreen-mint/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="name" placeholder="Rituraj Kotian"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-evergreen-mint/30">
                    </div>
                </div>

                <!-- Email field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-evergreen-mint/80">Work Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-evergreen-mint/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input type="email" id="email" required placeholder="developer@company.com"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-evergreen-mint/30">
                    </div>
                </div>

                <!-- Password field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-evergreen-mint/80">Account Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-evergreen-mint/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••••••"
                            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-xs placeholder-evergreen-mint/30">
                    </div>
                </div>

                <!-- Error Notice -->
                <div id="errorMsg" class="hidden text-xs text-rose-300 bg-rose-500/10 border border-rose-500/30 px-3.5 py-2.5 rounded-xl flex items-center gap-2">
                    <svg class="w-4 h-4 shrink-0 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Invalid authentication credentials.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn-emerald w-full py-3.5 rounded-xl font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-2 mt-2">
                    <span id="btnText">Sign In to Dashboard</span>
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <!-- Quick Demo Credentials for interview presentation -->
            <div class="mt-5 pt-4 border-t border-evergreen-mint/10">
                <button type="button" onclick="fillDemoCredentials()" 
                    class="w-full text-center py-2.5 px-3 rounded-xl bg-evergreen-pine/25 hover:bg-evergreen-pine/45 border border-evergreen-mint/20 text-evergreen-mint text-xs font-medium flex items-center justify-center gap-2 transition-all">
                    <svg class="w-4 h-4 text-evergreen-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m13 2-2 2.5h3L11 8l3-1-3.5 5 1.5-3H9l2.5-4.5H9L13 2z"/>
                    </svg>
                    <span>Auto-Fill Demo Credentials (Raj Shamani)</span>
                </button>
            </div>

            <!-- Footer Badge -->
            <div class="mt-6 pt-4 border-t border-evergreen-mint/10 flex items-center justify-between text-[11px] text-evergreen-mint/50">
                <span class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-evergreen-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    AES-256 Encrypted
                </span>
                <span>Session Isolation</span>
            </div>

        </div>

        <p class="text-center text-xs text-evergreen-mint/40 mt-4">
            CodeShield Enterprise • Static Application Security Platform
        </p>
    </div>

    <script>
        let isLogin = true;

        function switchTab(tab) {
            isLogin = (tab === 'login');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const nameField = document.getElementById('nameField');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            if (isLogin) {
                loginTab.className = "py-2.5 rounded-lg tab-active transition-all duration-200 font-semibold";
                signupTab.className = "py-2.5 rounded-lg tab-inactive transition-all duration-200";
                nameField.classList.add('hidden');
                document.getElementById('name').removeAttribute('required');
                btnText.textContent = "Sign In to Dashboard";
            } else {
                signupTab.className = "py-2.5 rounded-lg tab-active transition-all duration-200 font-semibold";
                loginTab.className = "py-2.5 rounded-lg tab-inactive transition-all duration-200";
                nameField.classList.remove('hidden');
                document.getElementById('name').setAttribute('required', 'true');
                btnText.textContent = "Create Account";
            }
        }

        function fillDemoCredentials() {
            if (!isLogin) switchTab('login');
            document.getElementById('email').value = "raj@gmail.com";
            document.getElementById('password').value = "raj";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            const endpoint = isLogin ? '/api/login' : '/api/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('codeshield_user', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    errorText.textContent = data.error || "Authentication failed.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = "Failed to connect to authentication server.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
