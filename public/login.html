<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShield Enterprise | Secure Gateway</title>
    <!-- Modern Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            base: '#060D1A',
                            abyss: '#0A1931',
                            panel: '#0F2544',
                            surface: '#1A3D63',
                            steel: '#4A7FA7',
                            mist: '#B3CFE5',
                            frost: '#F6FAFD',
                            danger: '#FF4D6D',
                            warning: '#F59E0B',
                            success: '#10B981',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --abyss: #0A1931;
            --surface: #1A3D63;
            --steel: #4A7FA7;
            --mist: #B3CFE5;
            --frost: #F6FAFD;
        }

        body {
            background-color: #060D1A;
            font-family: 'Inter', sans-serif;
            color: #F6FAFD;
        }

        /* Oceanic Cyber Grid Background */
        .cyber-bg {
            background-color: #060D1A;
            background-image:
                radial-gradient(ellipse 90% 65% at 50% -15%, rgba(74, 127, 167, 0.35), transparent 75%),
                radial-gradient(circle at 15% 90%, rgba(26, 61, 99, 0.4), transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(10, 25, 49, 0.8), transparent 50%),
                linear-gradient(rgba(179, 207, 229, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(179, 207, 229, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
        }

        /* Ambient Glow Orb */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 127, 167, 0.18) 0%, rgba(10, 25, 49, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
        }

        /* Bespoke Glassmorphic Card */
        .cyber-card {
            background: linear-gradient(165deg, rgba(15, 37, 68, 0.85) 0%, rgba(10, 25, 49, 0.95) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(179, 207, 229, 0.16);
            box-shadow:
                0 30px 70px -15px rgba(2, 6, 12, 0.9),
                0 0 45px -10px rgba(74, 127, 167, 0.2),
                inset 0 1px 1px 0 rgba(246, 250, 253, 0.18);
            position: relative;
        }

        /* Subtle Corner Technical Markers */
        .corner-notch::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 14px;
            height: 14px;
            border-top: 2px solid #B3CFE5;
            border-left: 2px solid #B3CFE5;
            border-top-left-radius: 1rem;
            opacity: 0.6;
        }
        .corner-notch::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-bottom: 2px solid #4A7FA7;
            border-right: 2px solid #4A7FA7;
            border-bottom-right-radius: 1rem;
            opacity: 0.6;
        }

        /* Cyber Button */
        .cyber-btn-primary {
            background: linear-gradient(135deg, #1A3D63 0%, #2A5A8C 50%, #4A7FA7 100%);
            border: 1px solid rgba(179, 207, 229, 0.35);
            box-shadow: 0 4px 20px -2px rgba(74, 127, 167, 0.4), inset 0 1px 0 rgba(246, 250, 253, 0.3);
            color: #F6FAFD;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .cyber-btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(246, 250, 253, 0.25), transparent);
            transform: skewX(-20deg);
            transition: 0.6s ease;
        }
        .cyber-btn-primary:hover {
            background: linear-gradient(135deg, #244F7E 0%, #356EAA 50%, #5B95C3 100%);
            box-shadow: 0 0 30px rgba(74, 127, 167, 0.65), inset 0 1px 0 rgba(246, 250, 253, 0.5);
            transform: translateY(-1px);
        }
        .cyber-btn-primary:hover::after {
            left: 140%;
        }
        .cyber-btn-primary:active {
            transform: translateY(1px);
        }

        /* Input field styling */
        .cyber-input {
            background-color: rgba(6, 13, 26, 0.7);
            border: 1px solid rgba(179, 207, 229, 0.14);
            color: #F6FAFD;
            transition: all 0.2s ease;
        }
        .cyber-input:focus {
            outline: none;
            border-color: #4A7FA7;
            box-shadow: 0 0 0 3px rgba(74, 127, 167, 0.25), 0 0 16px rgba(74, 127, 167, 0.2);
            background-color: rgba(6, 13, 26, 0.95);
        }
        .cyber-input::placeholder {
            color: #52708E;
        }

        /* Animated Pulse Dot */
        .cyber-dot {
            width: 7px;
            height: 7px;
            background-color: #10B981;
            border-radius: 9999px;
            box-shadow: 0 0 10px #10B981;
            position: relative;
        }
        .cyber-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 9999px;
            border: 1px solid #10B981;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="cyber-bg min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden selection:bg-cyber-steel selection:text-white">

    <!-- Ambient Glow Spots -->
    <div class="ambient-glow -top-32 -left-32"></div>
    <div class="ambient-glow -bottom-32 -right-32" style="background: radial-gradient(circle, rgba(26, 61, 99, 0.25) 0%, transparent 70%);"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Header Branding Card -->
        <div class="cyber-card corner-notch rounded-2xl p-6 sm:p-8">
            
            <!-- Logo & Brand Identity -->
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-[#1A3D63] to-[#0A1931] border border-cyber-mist/25 shadow-[0_0_25px_rgba(74,127,167,0.3)] mb-3.5 group">
                    <svg class="w-7 h-7 text-cyber-mist group-hover:scale-105 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>

                <div class="flex items-center justify-center gap-2 mb-1">
                    <h1 class="font-display text-xl sm:text-2xl font-bold tracking-tight text-cyber-frost">
                        CodeShield
                    </h1>
                    <span class="font-mono text-[10px] tracking-widest font-semibold px-2 py-0.5 rounded bg-cyber-steel/20 border border-cyber-mist/30 text-cyber-mist uppercase">
                        Enterprise
                    </span>
                </div>
                <p class="text-xs text-cyber-mist/70 font-sans">
                    Multi-Vector SAST Engine & AI Security Workspace
                </p>
                <div class="flex items-center justify-center gap-2 mt-2 text-[11px] font-mono text-cyber-mist/50">
                    <span class="cyber-dot"></span>
                    <span>SYSTEM ONLINE // GATEWAY SECURE</span>
                </div>
            </div>

            <!-- Tab Navigation (Sign In vs Create Account) -->
            <div class="grid grid-cols-2 p-1 bg-cyber-base/80 rounded-xl border border-cyber-mist/10 mb-6 text-xs font-mono">
                <button onclick="switchTab('login')" id="loginTab" class="py-2.5 rounded-lg bg-cyber-surface text-cyber-frost border border-cyber-mist/20 font-semibold shadow-sm transition-all duration-200">
                    ACCESS PORTAL
                </button>
                <button onclick="switchTab('signup')" id="signupTab" class="py-2.5 rounded-lg text-cyber-mist/60 hover:text-cyber-mist transition-all duration-200 font-medium">
                    REGISTER
                </button>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                
                <!-- Name field (Signup only) -->
                <div id="nameField" class="hidden space-y-1.5 transition-all duration-300">
                    <label class="block text-xs font-mono uppercase tracking-wider text-cyber-mist/70">
                        Engineer Name
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-cyber-mist/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="name" placeholder="Rituraj Kotian"
                            class="cyber-input w-full pl-10 pr-4 py-3 rounded-xl text-xs font-sans placeholder-cyber-mist/30">
                    </div>
                </div>

                <!-- Email field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-mono uppercase tracking-wider text-cyber-mist/70">
                        Work Identity / Email
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-cyber-mist/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input type="email" id="email" required placeholder="engineer@codeshield.internal"
                            class="cyber-input w-full pl-10 pr-4 py-3 rounded-xl text-xs font-sans placeholder-cyber-mist/30">
                    </div>
                </div>

                <!-- Password field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-mono uppercase tracking-wider text-cyber-mist/70">
                        Access Key / Password
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-cyber-mist/40">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••••••"
                            class="cyber-input w-full pl-10 pr-4 py-3 rounded-xl text-xs font-mono placeholder-cyber-mist/30">
                    </div>
                </div>

                <!-- Error Toast / Notice -->
                <div id="errorMsg" class="hidden text-xs font-mono text-cyber-danger bg-cyber-danger/10 border border-cyber-danger/30 px-3.5 py-2.5 rounded-xl flex items-center gap-2">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Invalid authentication credentials.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="cyber-btn-primary w-full py-3.5 rounded-xl font-display font-semibold text-xs tracking-wide uppercase flex items-center justify-center gap-2 mt-2">
                    <span id="btnText">Authenticate Session</span>
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <!-- Quick Demo Credentials Fill Pill (Super helpful for interview demonstration) -->
            <div class="mt-5 pt-4 border-t border-cyber-mist/10">
                <button type="button" onclick="fillDemoCredentials()" 
                    class="w-full text-center py-2 px-3 rounded-lg bg-cyber-surface/40 hover:bg-cyber-surface/80 border border-cyber-mist/15 text-cyber-mist text-[11px] font-mono flex items-center justify-center gap-2 transition-colors">
                    <svg class="w-3.5 h-3.5 text-cyber-steel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m13 2-2 2.5h3L11 8l3-1-3.5 5 1.5-3H9l2.5-4.5H9L13 2z"/>
                    </svg>
                    <span>Quick Fill Demo Account (Raj Shamani)</span>
                </button>
            </div>

            <!-- Footer Compliance Indicators -->
            <div class="mt-6 pt-4 border-t border-cyber-mist/10 flex items-center justify-between text-[10px] font-mono text-cyber-mist/40">
                <span class="flex items-center gap-1.5">
                    <svg class="w-3 h-3 text-cyber-steel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    AES-256 SESSION
                </span>
                <span>ZERO-TRUST COMPLIANT</span>
            </div>

        </div>

        <!-- Subtle subtext -->
        <p class="text-center text-[11px] text-cyber-mist/40 font-mono mt-4">
            CodeShield Pro v2.5 • Proprietary Enterprise SAST Framework
        </p>
    </div>

    <script>
        let isLogin = true;

        function switchTab(tab) {
            isLogin = (tab === 'login');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const nameField = document.getElementById('nameField');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            if (isLogin) {
                loginTab.className = "py-2.5 rounded-lg bg-cyber-surface text-cyber-frost border border-cyber-mist/20 font-semibold shadow-sm transition-all duration-200";
                signupTab.className = "py-2.5 rounded-lg text-cyber-mist/60 hover:text-cyber-mist transition-all duration-200 font-medium";
                nameField.classList.add('hidden');
                document.getElementById('name').removeAttribute('required');
                btnText.textContent = "Authenticate Session";
            } else {
                signupTab.className = "py-2.5 rounded-lg bg-cyber-surface text-cyber-frost border border-cyber-mist/20 font-semibold shadow-sm transition-all duration-200";
                loginTab.className = "py-2.5 rounded-lg text-cyber-mist/60 hover:text-cyber-mist transition-all duration-200 font-medium";
                nameField.classList.remove('hidden');
                document.getElementById('name').setAttribute('required', 'true');
                btnText.textContent = "Deploy Developer Account";
            }
        }

        function fillDemoCredentials() {
            if (!isLogin) switchTab('login');
            document.getElementById('email').value = "raj@gmail.com";
            document.getElementById('password').value = "raj";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            const endpoint = isLogin ? '/api/login' : '/api/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('codeshield_user', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    errorText.textContent = data.error || "Authentication rejected.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = "Connection to security gateway failed. Ensure server is active.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
